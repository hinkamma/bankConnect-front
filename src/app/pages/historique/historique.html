<div class="app-wrapper">

  <div class="sideBar">
    <app-navigation></app-navigation>
  </div>

  <main class="app-main">
    <div class="bc-historique">

      <!-- HEADER -->
      <header class="bc-historique__header">
        <div>
          <h1 class="bc-historique__title">Historique des transactions</h1>
          <p class="bc-historique__subtitle">Retrouvez l'ensemble de vos opérations</p>
        </div>
        <button type="button" class="bc-btn-secondary">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Exporter
        </button>
      </header>

      <!-- FILTRES -->
      <div class="bc-filters">
        <select class="bc-filters__control">
          <option>Tous les comptes</option>
          <option>Compte courant</option>
          <option>Compte épargne</option>
        </select>
        <select class="bc-filters__control">
          <option>Toutes les opérations</option>
          <option>Entrées</option>
          <option>Sorties</option>
        </select>
        <input type="text" class="bc-filters__control" placeholder="jj/mm/aaaa" />
        <span class="bc-filters__sep">—</span>
        <input type="text" class="bc-filters__control" placeholder="jj/mm/aaaa" />
        <label class="bc-filters__search">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/>
            <path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <input type="text" placeholder="Rechercher..." />
        </label>
      </div>

      <!-- PANEL PRINCIPAL -->
      <div class="bc-panel">

        <!-- ETAT DE CHARGEMENT -->
        <div *ngIf="isLoading()" class="bc-loading-state" style="text-align: center; padding: 2rem 0;">
          <p>Chargement des opérations...</p>
        </div>

        <!-- LISTE DES TRANSACTIONS -->
        <ng-container *ngIf="!isLoading()">

          <!-- AUCUNE TRANSACTION -->
          <div *ngIf="transactions().length === 0" style="text-align: center; padding: 2rem 0;">
            <p>Aucune opération trouvée.</p>
          </div>

          <!-- BOUCLE DYNAMIQUE DES TRANSACTIONS -->
          <div class="bc-row" *ngFor="let item of transactions()">

            <!-- ICONE DYNAMIQUE (Rouge pour Débit/Sortie, Vert/Teal pour Crédit/Entrée) -->
            <div class="bc-row__icon" [ngClass]="item.sens === 'DEBIT' ? 'bc-row__icon--red' : 'bc-row__icon--teal'">

              <!-- Icône Sortie / Débit -->
              <svg *ngIf="item.sens === 'DEBIT'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M7 17L17 7M17 7H9M17 7v8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>

              <!-- Icône Entrée / Crédit -->
              <svg *ngIf="item.sens === 'CREDIT'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M17 7L7 17M7 17h8M7 17V9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>

            <!-- INFORMATIONS DE LA TRANSACTION -->
            <div class="bc-row__info">
              <span class="bc-row__name">{{ item.description || item.type }}</span>
              <span class="bc-row__meta">
                {{ item.date }} · Réf. {{ item.reference }}
              </span>
            </div>

            <!-- TYPE DE TRANSACTION -->
            <span class="bc-row__tag">{{ item.type }}</span>

            <!-- MONTANT (+ ou - selon le sens) -->
            <span class="bc-row__amount" [ngClass]="item.sens === 'DEBIT' ? 'bc-row__amount--out' : 'bc-row__amount--in'">
              {{ item.montant }} FCFA
            </span>

          </div>
        </ng-container>

        <!-- PAGINATION (Raccordée sans changer le style ni la structure) -->
        <div class="bc-pagination" *ngIf="!isLoading() && transactions().length > 0">
          <button
            type="button"
            class="bc-pagination__btn"
            [disabled]="currentPage() === 1"
            (click)="previousPage()">
            Précédent
          </button>

          <div class="bc-pagination__pages">
            <span
              *ngFor="let page of pagesArray"
              class="bc-pagination__page"
              [class.is-active]="page === currentPage()"
              (click)="goToPage(page)">
              {{ page }}
            </span>
          </div>

          <button
            type="button"
            class="bc-pagination__btn"
            [disabled]="currentPage() === lastPage()"
            (click)="nextPage()">
            Suivant
          </button>
        </div>

      </div>

    </div>
  </main>
</div>
