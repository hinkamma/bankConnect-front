<aside class="bc-nav">

  <div class="bc-nav__brand">
    <div class="bc-nav__logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L2 7v2h20V7L12 2z" fill="currentColor"/>
        <path d="M4 10v9h2v-9H4zm5 0v9h2v-9H9zm5 0v9h2v-9h-2zm5 0v9h2v-9h-2z" fill="currentColor"/>
        <path d="M2 21h20v2H2v-2z" fill="currentColor"/>
      </svg>
    </div>
    <span class="bc-nav__brand-name">BankConnect</span>
  </div>

  <nav class="bc-nav__menu">
    <span class="bc-nav__section-label">Menu</span>

    <a routerLink="/dashboard" routerLinkActive="is-active" class="bc-nav__link">
      <span class="bc-nav__icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.8"/>
          <rect x="13" y="3" width="8" height="5" rx="2" stroke="currentColor" stroke-width="1.8"/>
          <rect x="13" y="12" width="8" height="9" rx="2" stroke="currentColor" stroke-width="1.8"/>
          <rect x="3" y="13" width="8" height="8" rx="2" stroke="currentColor" stroke-width="1.8"/>
        </svg>
      </span>
      <span class="bc-nav__label">Tableau de bord</span>
    </a>

    <a routerLink="/compte" routerLinkActive="is-active" class="bc-nav__link">
      <span class="bc-nav__icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 10h18M5 10v9a1 1 0 001 1h12a1 1 0 001-1v-9M3 10l9-6 9 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="bc-nav__label">Comptes</span>
    </a>

    <a routerLink="/virement" routerLinkActive="is-active" class="bc-nav__link">
      <span class="bc-nav__icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 7h13m0 0l-4-4m4 4l-4 4M17 17H4m0 0l4 4m-4-4l4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="bc-nav__label">Virements</span>
    </a>

    <a routerLink="/historique" routerLinkActive="is-active" class="bc-nav__link">
      <span class="bc-nav__icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
          <path d="M12 7v5l3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="bc-nav__label">Historique</span>
    </a>

    <a routerLink="/notifications" routerLinkActive="is-active" class="bc-nav__link">
      <span class="bc-nav__icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M13.73 21a2 2 0 01-3.46 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="bc-nav__label">Notifications</span>
      <span class="bc-nav__badge">3</span>
    </a>

    <span class="bc-nav__section-label">Compte</span>

    <a routerLink="/profil" routerLinkActive="is-active" class="bc-nav__link">
      <span class="bc-nav__icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/>
          <path d="M4 20c0-4 3.5-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="bc-nav__label">Profil</span>
    </a>

    <a routerLink="/parametre" routerLinkActive="is-active" class="bc-nav__link">
      <span class="bc-nav__icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
          <path d="M19.4 13a7.97 7.97 0 000-2l2.1-1.6-2-3.4-2.5 1a8 8 0 00-1.7-1L14.9 3h-4l-.4 2.9a8 8 0 00-1.7 1l-2.5-1-2 3.4L6.4 11a7.97 7.97 0 000 2l-2.1 1.6 2 3.4 2.5-1a8 8 0 001.7 1l.4 2.9h4l.4-2.9a8 8 0 001.7-1l2.5 1 2-3.4L19.4 13z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="bc-nav__label">Paramètres</span>
    </a>
  </nav>

  <!-- BLOC UTILISATEUR DYNAMIQUE -->
  <div class="bc-nav__user">
    <div class="bc-nav__avatar">
      <!-- Si une photo existe dans userAccount, on l'affiche -->
      <ng-container *ngIf="this.user()">
        <img [src]="this.user()?.profile_photo" [alt]="this.user()?.profile_photo" class="bc-nav__avatar-img" />
      </ng-container>

      <!-- Sinon, on affiche les initiales dynamiques (ex: FH) -->
      <ng-template #textAvatar>
        dddd
      </ng-template>
    </div>

    <div class="bc-nav__user-info">
      <!-- Affiche "Prénom Nom" ou 'Chargement...' pendant l'appel API -->
      <span class="bc-nav__user-name" *ngIf=" user()">

      </span>

      <!-- Affiche le rôle ou le type de compte s'il existe -->
      <span class="bc-nav__user-role" *ngIf=" this.user()">
        compte {{ userAccount?.role || userAccount?.type || 'Compte particulier' }}
      </span>
    </div>

    <button type="button" class="bc-nav__logout" aria-label="Déconnexion" (click)="showLogoutConfirm = true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <!-- Modal de confirmation de déconnexion -->
    <div class="modal-overlay" *ngIf="showLogoutConfirm" (click)="showLogoutConfirm = false">
      <div class="modal-box" (click)="$event.stopPropagation()">
        <div class="modal-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" x2="9" y1="12" y2="12"/>
          </svg>
        </div>

        <h2 class="modal-title">Se déconnecter ?</h2>
        <p class="modal-text">Vous devrez ressaisir vos identifiants pour accéder à nouveau à votre compte.</p>

        <div class="modal-actions">
          <button type="button" class="modal-btn modal-btn--cancel bc-nav__logout" (click)="showLogoutConfirm = false">
            Annuler
          </button>
          <button type="button" class="modal-btn modal-btn--confirm" (click)="confirmLogout()" [disabled]="isLoggingOut">
            <span *ngIf="!isLoggingOut">Déconnexion</span>
            <span class="btn-spinner" *ngIf="isLoggingOut"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

</aside>
